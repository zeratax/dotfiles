version: 2
updates:
  - package-ecosystem: nix
    directory: /
    # early, so CI is done before services/dotfiles-update checks
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
    # one PR for all flake inputs instead of one per input
    groups:
      flake-inputs:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
